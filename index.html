<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار 1 الألعاب | عروض الألعاب المجانية</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1 class="brand">1 رادار <span>الألعاب</span></h1>
            <button id="language-button" class="btn-lang">English</button>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h2 id="hero-title">اكتشف أحدث الألعاب المجانية</h2>
            <p id="hero-subtitle">لا تفوت الفرصة! احصل على ألعابك المفضلة مجاناً من أشهر المنصات قبل انتهاء العروض.</p>
        </div>
    </header>

    <main>
        <section id="games-section">
            <div class="section-title">
                <h3 id="section-heading">الألعاب المتاحة حالياً</h3>
                <div class="line"></div>
            </div>
            <div class="games-container" id="free-games-container">
                <div class="loading">جاري التحميل...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p id="footer-text">جميع الحقوق محفوظة &copy; 2026 رادار الألعاب</p>
            <div class="sponsor">
                <span id="sponsor-text">برعاية</span>
                <a href="https://mfatihy.com/" target="_blank" class="sponsor-link">
                    متجر مفاتيحي
                </a>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
